uot;</text><text x="314" y="461" font-size="17" fill="#566580" font-weight="400">}</text><path d="M296 502L928 502" fill="none" stroke="#cbd0dd" stroke-width="1" stroke-dasharray=""/><text x="310" y="532" font-size="15" fill="#70788b" font-weight="600">RESPONSE</text><rect x="812" y="510" width="100" height="30" rx="15" fill="#d4e2c9" stroke="none"/><text x="824" y="531" font-size="15" fill="#304637" font-weight="400">SCHEMA</text><rect x="296" y="550" width="632" height="76" rx="7" fill="#f4f5fa" stroke="none"/><text x="315" y="580" font-size="17" fill="#566580" font-weight="400">{ &quot;labels&quot;: [ ... ], &quot;assessment&quot;: { ... } }</text><text x="315" y="609" font-size="16" fill="#6e7b77" font-weight="400">Data format → Validation → Delivery</text><text x="60" y="690" font-size="16" fill="#607363" font-weight="400">CONTRACT → REQUEST → RESPONSE → ACCEPTANCE</text></g></svg>