<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>Clear contracts. Easier integration.</title><desc>Structured input, readable output and agreed acceptance rules. — conceptual interface, not a product screenshot.</desc><defs><linearGradient id="surface" x2="0.8" y2="1"><stop stop-color="#e7f2df"/><stop offset=".5" stop-color="#779a88"/><stop offset="1" stop-color="#2f5a4c"/></linearGradient><radialGradient id="image"><stop stop-color="#afb8b1"/><stop offset=".65" stop-color="#65766b"/><stop offset="1" stop-color="#26382e"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#748776" stroke-width="1.3"/></marker></defs><rect width="1000" height="760" fill="#e1e1ef"/><g font-family="Arial, sans-serif"><text x="60" y="53" font-size="17" fill="#607363" font-weight="400">LINGYA CLOUD / API PLATFORM</text><text x="60" y="111" font-size="39" fill="#263b34" font-weight="700">Clear contracts. Easier integration.</text><text x="60" y="149" font-size="17" fill="#607363" font-weight="400">Structured input, readable output and agreed acceptance rules.</text><rect x="55" y="191" width="890" height="456" rx="16" fill="#fbfcf8" stroke="#bdcdb9"/><path d="M55 238L945 238" fill="none" stroke="#dce4d6" stroke-width="1" stroke-dasharray=""/><circle cx="78" cy="215" r="4" fill="#93a68d" stroke="none"/><circle cx="94" cy="215" r="4" fill="#b5c5a5" stroke="none"/><circle cx="110" cy="215" r="4" fill="#d4dfca" stroke="none"/><text x="140" y="221" font-size="17" fill="#526753" font-weight="600">CLOUD / API WORKSPACE</text><text x="785" y="221" font-size="14" fill="#526753" font-weight="400">CONCEPT VIEW</text><rect x="71" y="254" width="209" height="372" rx="7" fill="#efeff7" stroke="none"/><text x="88" y="285" font-size="15" fill="#6f7185" font-weight="600">API COLLECTION</text><rect x="82" y="309" width="186" height="49" rx="6" fill="#d8decf"