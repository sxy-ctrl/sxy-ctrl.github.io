<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>A conversation that takes action.</title><desc>Natural language, shared context and controlled editing. — conceptual interface, not a product screenshot.</desc><defs><linearGradient id="surface" x2="0.8" y2="1"><stop stop-color="#e7f2df"/><stop offset=".5" stop-color="#779a88"/><stop offset="1" stop-color="#2f5a4c"/></linearGradient><radialGradient id="image"><stop stop-color="#afb8b1"/><stop offset=".65" stop-color="#65766b"/><stop offset="1" stop-color="#26382e"/></radialGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#748776" stroke-width="1.3"/></marker></defs><rect width="1000" height="760" fill="#dce9c4"/><g font-family="Arial, sans-serif"><text x="60" y="53" font-size="17" fill="#607363" font-weight="400">LINGAGENT / CONTEXT &amp; TOOL USE</text><text x="60" y="111" font-size="39" fill="#263b34" font-weight="700">A conversation that takes action.</text><text x="60" y="149" font-size="17" fill="#607363" font-weight="400">Natural language, shared context and controlled editing.</text><rect x="55" y="191" width="890" height="456" rx="16" fill="#fbfcf8" stroke="#bdcdb9"/><path d="M55 238L945 238" fill="none" stroke="#dce4d6" stroke-width="1" stroke-dasharray=""/><circle cx="78" cy="215" r="4" fill="#93a68d" stroke="none"/><circle cx="94" cy="215" r="4" fill="#b5c5a5" stroke="none"/><circle cx="110" cy="215" r="4" fill="#d4dfca" stroke="none"/><text x="140" y="221" font-size="17" fill="#526753" font-weight="600">AGENT / WORKFLOW</text><text x="785" y="221" font-size="14" fill="#526753" font-weight="400">CONCEPT VIEW</text><rect x="71" y="255" width="269" height="373" rx="8" fill="#eff5e4" stroke="none"/><text x="90" y="286" font-size="15" fill="#677e55" font-weight="600">CONVERSATION</text><rect x="89" y="307" width="231" height="76" rx="10" fill="#d3e7af" stroke="none"/><text x="105" y="338" font-size="18" fill="#263b34" font-weight="600">Edit the current plan.</text><text x="105" y="362" font-size="15" fill="#263b34" font-weight="400">Keep existing constraints.</text><rect x="89" y="399" width="231" height="143" rx="10" fill="#fff" stroke="none"/><text x="105" y="429" font-size="16" fill="#263b34" font-weight="600">Agent</text><text x="105" y="459" font-size="16" fill="#263b34" font-weight="400">Read current state</text><text x="105" y="486" font-size="16" fill="#263b34" font-weight="400">Select an editing tool</text><text x="105" y="513" font-size="15" fill="#263b34" font-weight="400">Return changes for review</text><rect x="89" y="573" width="231" height="30" rx="15" fill="#294333" stroke="none"/><text x="101" y="594" font-size="15" fill="#ecf3e4" font-weight="400">CONTEXT → TOOL → REPLY</text><path d="M610 315L610 350" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 415L610 450" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M720 483L768 483" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M824 515L824 570" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M824 601L610 601" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M610 570L610 548" fill="none" stroke="#627b6a" stroke-width="2" marker-end="url(#arrow)"/><path d="M500 483H385V383H500" fill="none" stroke="#627b6a" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/><rect x="500" y="261" width="220" height="54" rx="12" fill="#e7f0dd" stroke="#b3c59e"/><text x="524" y="295" font-size="20" fill="#263b34" font-weight="600">Request + context</text><rect x="500" y="350" width="220" height="65" rx="12" fill="#2b4437" stroke="none"/><text x="526" y="389" font-size="22" fill="#d4f663" font-weight="600">AGENT / PLAN</text><rect x="500" y="450" width="220" height="65" rx="12" fill="#f8fbf3" stroke="#b3c59e